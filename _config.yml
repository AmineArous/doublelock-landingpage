# Feature List
features                                  :

  - title                                 : Four Handcrafted Scenes
    description                           : Victor's study in Paris, a night train to Venice, a secret studio on a canal and a yacht on the Adriatic.
    fontawesome_icon_name                 : map-marked-alt

  - title                                 : A Film-Noir Story
    description                           : An art forger, an investigative journalist and a chase across Europe, in 1930s style.
    fontawesome_icon_name                 : film

  - title                                 : Puzzles Hidden in Every Object
    description                           : Safes, a chess problem, mirror writing, a magic lantern, a lighthouse in the night and more.
    fontawesome_icon_name                 : puzzle-piece

  - title                                 : A New Artist Each Time
    description                           : In Venice, every game draws one of eight painters for you to unmask.
    fontawesome_icon_name                 : palette

  - title                                 : One Hint at a Time
    description                           : A hint matched to where you are in the scene. Never the answer.
    fontawesome_icon_name                 : lightbulb

  - title                                 : First Scene Free
    description                           : Unlock the other three with a single purchase. English and French, no account, no ads.
    fontawesome_icon_name                 : unlock



